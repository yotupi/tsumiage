<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>積み上げ</title>
<style>
:root{
  --bg:#f6f5f1; --card:#fff; --text:#1f211d; --muted:#777b73; --line:#e6e4dc;
  --accent:#58652d; --accent-soft:#eef1df; --warn:#f3e9ba; --warn-text:#725e16;
  --danger:#963d3d; --danger-soft:#f6dddd; --shadow:0 8px 24px rgba(40,42,36,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#ecebe7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{width:min(100%,520px);min-height:100vh;margin:0 auto;background:var(--bg);padding:18px 16px 104px;position:relative}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.eyebrow{font-size:12px;color:var(--muted);margin-bottom:3px}
h1{font-size:28px;margin:0;letter-spacing:-.025em}
h2{font-size:17px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.stack{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#f1f1ec;font-size:11px;line-height:1}
.pill.high{background:#f8dfdf;color:#8c3434}
.pill.mid{background:#f5edcf;color:#755f16}
.pill.low{background:#e8efe4;color:#526248}
.pill.overdue{background:var(--danger-soft);color:var(--danger)}
.pill.warning{background:var(--warn);color:var(--warn-text)}
.btn{min-height:42px;border:none;border-radius:12px;padding:0 14px;background:#1f211d;color:#fff;font-weight:750}
.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:#4a5724}
.btn.danger{background:var(--danger-soft);color:var(--danger);border:1px solid #efcece}
.btn.small-btn{min-height:34px;padding:0 10px;font-size:11px}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center;color:#62665f}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;outline:none;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:#aeb98c;box-shadow:0 0 0 3px rgba(88,101,45,.08)}
textarea{resize:vertical;min-height:92px}
.quick{display:grid;grid-template-columns:1fr auto;gap:8px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 9px}
.task-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;user-select:none;-webkit-user-select:none}
.task-card.completed{opacity:.72}
.task-card.completed .task-title{text-decoration:line-through}
.task-card.overdue{border-color:#e7b8b8}
.task-main{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.check{width:24px;height:24px;border-radius:50%;border:1.8px solid #aeb2a8;background:#fff;margin-top:1px;position:relative;flex:none}
.check.done{background:var(--accent);border-color:var(--accent)}
.check.done:after{content:"✓";color:#fff;position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800}
.task-body{min-width:0}
.task-title{font-weight:780;line-height:1.35;word-break:break-word}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.task-note{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5;white-space:pre-wrap}
.result-box{margin-top:9px;background:#f7f7f3;border-radius:11px;padding:9px 10px;font-size:12px;line-height:1.5;white-space:pre-wrap}
.grip{display:none;width:34px;height:34px;border:none;background:transparent;color:#a7aaa2;font-size:20px;line-height:1;touch-action:none;align-items:center;justify-content:center}
.reorder-mode .grip{display:flex}
.reorder-mode .task-card{touch-action:none}
.dragging{opacity:.45}
.segment{display:flex;background:#ecece6;border-radius:12px;padding:3px;overflow:auto}
.segment button{min-width:max-content;flex:1;border:none;background:transparent;padding:8px 10px;border-radius:9px;color:var(--muted);font-size:12px;font-weight:750}
.segment button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.project-filter-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.inline-project-create{display:none;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.inline-project-create.show{display:grid}
.project-list{display:grid;gap:10px}
.project-item{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.project-item-name{font-weight:800}
.project-item-actions{display:flex;gap:8px;margin-top:10px}
.project-item-actions button{flex:1}
.project-delete-note{font-size:12px;color:var(--muted);line-height:1.55}
.journal-preview{line-height:1.7;font-size:14px;white-space:pre-wrap}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;color:var(--muted);font-size:11px;padding:3px 0}
.day{aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;position:relative;font-size:11px;color:var(--text)}
.day.other{opacity:.28}
.day.active{background:var(--accent-soft);border-color:#bcc79b}
.day .mark{position:absolute;right:5px;bottom:4px;font-size:9px;color:var(--muted)}
.day .dot{width:5px;height:5px;background:var(--accent);border-radius:50%;position:absolute;left:6px;bottom:6px}
.day-detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.day-date{font-size:18px;font-weight:800}
.completed-item{border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(250,249,246,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}
.nav-btn{border:none;background:transparent;color:#8b8f86;display:grid;gap:2px;justify-items:center;font-size:10px;padding:6px 2px}
.nav-btn .ico{font-size:18px}
.nav-btn.active{color:#344018;font-weight:800}
.screen{display:none}
.screen.active{display:block}
.modal-wrap{position:fixed;inset:0;background:rgba(20,21,19,.36);z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal-wrap.show{display:flex}
.modal{width:min(100%,520px);max-height:90vh;overflow:auto;background:#faf9f6;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.modal h3{margin:0 0 14px;font-size:19px}
.form-grid{display:grid;gap:12px}
.form-grid label,.field{display:grid;gap:6px;font-size:12px;color:var(--muted)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1}
.divider{height:1px;background:var(--line);margin:12px 0}
.notice{background:#eef1df;border:1px solid #dce2be;border-radius:13px;padding:10px 12px;color:#4d572b;font-size:12px;line-height:1.5}
.prompt{white-space:pre-wrap;background:#f3f3ef;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12px;line-height:1.65;max-height:320px;overflow:auto}
.empty{padding:18px 10px;text-align:center;color:var(--muted);font-size:12px}
.hidden{display:none!important}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:390px){
  .project-filter-row{grid-template-columns:1fr}
  .project-filter-row .btn{width:100%}
}
</style>
</head>
<body>
<div class="app" id="app">

<section class="screen active" data-screen="today">
  <div class="header">
    <div><div class="eyebrow" id="todayDateLabel"></div><h1>Today</h1></div>
  </div>

  <div class="card stack">
    <div>
      <div class="small muted">今日の進捗</div>
      <div style="font-size:24px;font-weight:800;margin-top:2px"><span id="todayDoneCount">0</span> / <span id="todayCount">0</span></div>
    </div>
    <div class="quick">
      <input id="quickAdd" placeholder="タスクをすぐ追加" autocomplete="off">
      <button class="btn soft" id="quickAddBtn">追加</button>
    </div>
  </div>

  <div class="section-title">
    <h2>今日やる</h2>
    <button class="btn secondary small-btn" id="reorderToday">並び替え</button>
  </div>
  <div class="stack" id="todayTasks"></div>

  <div class="section-title">
    <h2>今日の日報</h2>
    <button class="btn secondary small-btn" id="makeDailyPrompt">AI用プロンプト</button>
  </div>
  <div class="card">
    <div id="todayJournalView"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn soft" id="todayJournalEdit">作成・編集</button>
      <button class="btn secondary" id="todayJournalDelete">削除</button>
    </div>
  </div>
</section>

<section class="screen" data-screen="tasks">
  <div class="header">
    <div><div class="eyebrow">すべての仕事</div><h1>Tasks</h1></div>
    <button class="btn" id="newTaskBtn">＋ 新規</button>
  </div>

  <div class="stack">
    <input id="searchTasks" placeholder="タイトル・メモを検索" autocomplete="off">

    <div class="segment" id="taskSegments">
      <button class="active" data-filter="all">すべて</button>
      <button data-filter="dated">日付あり</button>
      <button data-filter="completed">完了</button>
      <button data-filter="archived">アーカイブ</button>
    </div>

    <div class="project-filter-row">
      <select id="projectSelect" aria-label="プロジェクトで絞り込む"></select>
      <button class="btn secondary" id="manageProjectsBtn">プロジェクト管理</button>
    </div>

    <div class="row between">
      <div class="small muted" id="taskCountLabel">0件</div>
      <button class="btn secondary small-btn" id="reorderTasks">並び替え</button>
    </div>

    <div id="taskList" class="stack"></div>
  </div>
</section>

<section class="screen" data-screen="calendar">
  <div class="header"><div><div class="eyebrow">記録を振り返る</div><h1>Calendar</h1></div></div>

  <div class="section-title"><h2 id="dayRecordTitle">今日の記録</h2></div>
  <div class="card" id="dayDetail"></div>

  <div class="section-title"><h2>カレンダー</h2></div>
  <div class="card">
    <div class="calendar-head">
      <button class="icon-btn" id="prevMonth" aria-label="前の月">‹</button>
      <strong id="calendarTitle"></strong>
      <button class="icon-btn" id="nextMonth" aria-label="次の月">›</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
</section>

<section class="screen" data-screen="review">
  <div class="header"><div><div class="eyebrow">積み上げを言語化する</div><h1>Review</h1></div></div>

  <div class="card stack">
    <label class="field">期間
      <div class="row">
        <input type="date" id="reviewFrom">
        <span>〜</span>
        <input type="date" id="reviewTo">
      </div>
    </label>

    <label class="field">目的
      <select id="reviewPurpose">
        <option>成長を振り返る</option>
        <option>次の目標を考える</option>
        <option>半期評価の材料にする</option>
        <option>キャリア・ポートフォリオ整理</option>
      </select>
    </label>

    <button class="btn" id="generateReview">AI分析用プロンプトを作る</button>
  </div>

  <div class="section-title">
    <h2>生成結果</h2>
    <button class="btn secondary small-btn" id="copyReview">コピー</button>
  </div>
  <div class="prompt" id="reviewPrompt">期間と目的を選んで生成してください。</div>
</section>

</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-nav="today"><span class="ico">●</span><span>Today</span></button>
  <button class="nav-btn" data-nav="tasks"><span class="ico">☑</span><span>Tasks</span></button>
  <button class="nav-btn" data-nav="calendar"><span class="ico">▦</span><span>Calendar</span></button>
  <button class="nav-btn" data-nav="review"><span class="ico">↗</span><span>Review</span></button>
</nav>

<div class="modal-wrap" id="taskModalWrap">
  <div class="modal">
    <h3 id="taskModalTitle">タスクを編集</h3>
    <div class="form-grid">
      <label>タイトル<input id="fTitle" autocomplete="off"></label>

      <label>プロジェクト
        <select id="fProjectSelect"></select>
        <div class="inline-project-create" id="inlineProjectCreate">
          <input id="newProjectName" placeholder="新しいプロジェクト名" autocomplete="off">
          <button type="button" class="btn soft" id="createProjectInline">作成</button>
        </div>
      </label>

      <label>メモ<textarea id="fMemo" placeholder="詳細や補足"></textarea></label>

      <label>実行日
        <div class="row">
          <input type="date" id="fDoDate">
          <button type="button" class="btn secondary small-btn" id="clearDoDate">外す</button>
        </div>
      </label>

      <label>期限<input type="date" id="fDueDate"></label>

      <label>優先度
        <select id="fPriority">
          <option value="high">高</option>
          <option value="mid">中</option>
          <option value="low">低</option>
        </select>
      </label>

      <label>繰り返し
        <select id="fRepeat">
          <option value="">なし</option>
          <option value="daily">毎日</option>
          <option value="weekly">毎週</option>
          <option value="monthly">毎月</option>
        </select>
      </label>

      <label id="fResultLabel" class="hidden">成果・ひとことメモ
        <textarea id="fResult"></textarea>
      </label>
    </div>

    <div class="divider"></div>

    <div class="top-actions">
      <button class="btn danger" id="deleteTaskBtn">削除</button>
      <button class="btn secondary" id="archiveTaskBtn">アーカイブ</button>
    </div>

    <div class="modal-actions">
      <button class="btn secondary" data-close="taskModalWrap">キャンセル</button>
      <button class="btn" id="saveTaskBtn">保存</button>
    </div>
  </div>
</div>

<div class="modal-wrap" id="projectModalWrap">
  <div class="modal">
    <h3>プロジェクト管理</h3>
    <div class="notice">プロジェクト名は複数のタスクで共有されます。名前を変更すると、そのプロジェクトを使っているタスクにも反映されます。</div>

    <div style="height:12px"></div>
    <div class="quick">
      <input id="projectManagerNewName" placeholder="新しいプロジェクト名" autocomplete="off">
      <button class="btn soft" id="projectManagerCreate">追加</button>
    </div>

    <div style="height:14px"></div>
    <div class="project-list" id="projectList"></div>

    <div class="modal-actions"><button class="btn" data-close="projectModalWrap">閉じる</button></div>
  </div>
</div>

<div class="modal-wrap" id="projectDeleteWrap">
  <div class="modal">
    <h3>プロジェクトを削除</h3>
    <div class="project-delete-note" id="projectDeleteMessage"></div>
    <div style="height:12px"></div>

    <label class="field">このプロジェクトを使っているタスクの移動先
      <select id="projectDeleteDestination"></select>
    </label>

    <div class="modal-actions">
      <button class="btn secondary" data-close="projectDeleteWrap">キャンセル</button>
      <button class="btn danger" id="confirmProjectDelete">削除する</button>
    </div>
  </div>
</div>

<div class="modal-wrap" id="resultModalWrap">
  <div class="modal">
    <h3>タスクを完了</h3>
    <div class="notice">必要なら、あとで振り返れるように成果・ひとことメモを残せます。空欄でも完了できます。</div>
    <div style="height:12px"></div>

    <textarea id="resultMemo" placeholder="例：課題を整理して改善案を3点にまとめた"></textarea>

    <div class="modal-actions">
      <button class="btn secondary" id="completeWithoutMemo">メモなしで完了</button>
      <button class="btn" id="saveResultMemo">保存して完了</button>
    </div>
  </div>
</div>

<div class="modal-wrap" id="journalModalWrap">
  <div class="modal">
    <h3 id="journalModalTitle">日報</h3>
    <textarea id="journalText" placeholder="今日やったこと、考えたこと"></textarea>
    <div class="modal-actions">
      <button class="btn secondary" data-close="journalModalWrap">キャンセル</button>
      <button class="btn" id="saveJournal">保存</button>
    </div>
  </div>
</div>

<div class="modal-wrap" id="dailyPromptWrap">
  <div class="modal">
    <h3>日報作成用プロンプト</h3>
    <div class="prompt" id="dailyPrompt"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="copyDailyPrompt">コピー</button>
      <button class="btn" data-close="dailyPromptWrap">閉じる</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

const KEY="tsumiage-v2";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const uid=p=>(p||"id_")+Math.random().toString(36).slice(2,10);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayISO=()=>iso(new Date());
const parseDate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const jp=s=>{if(!s)return"";const [y,m,d]=s.split("-").map(Number);return `${m}月${d}日`};
const jpFull=s=>{if(!s)return"";const [y,m,d]=s.split("-").map(Number);return `${y}年${m}月${d}日`};
const addDays=(s,n)=>{const d=parseDate(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parseDate(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};

function emptyData(){
  return {version:2,projects:[],tasks:[],journals:[],todayOrder:{},createdAt:new Date().toISOString()};
}

function normalizeData(d){
  d&&typeof d==="object"||(d=emptyData());
  d.version=2;
  d.projects=Array.isArray(d.projects)?d.projects:[];
  d.tasks=Array.isArray(d.tasks)?d.tasks:[];
  d.journals=Array.isArray(d.journals)?d.journals:[];
  d.todayOrder=d.todayOrder&&typeof d.todayOrder==="object"?d.todayOrder:{};

  d.projects.forEach(p=>{
    p.id ||= uid("p_");
    p.name=String(p.name||"").trim();
    p.createdAt ||= new Date().toISOString();
  });

  d.tasks.forEach(t=>{
    t.id ||= uid("t_");
    t.title=String(t.title||"無題のタスク");
    t.projectId ||= "";
    t.memo ||= "";
    t.doDate ||= "";
    t.dueDate ||= "";
    t.priority ||= "mid";
    t.repeat ||= "";
    t.status ||= "open";
    t.completedAt ||= "";
    t.result ||= "";
    t.archived=!!t.archived;
    t.createdAt ||= new Date().toISOString();
    t.updatedAt ||= t.createdAt;
    t.generatedFromId ||= "";
    t.generatedNextId ||= "";
  });

  d.journals=d.journals
    .map(j=>typeof j==="string"?null:j)
    .filter(Boolean)
    .map(j=>({date:j.date||"",text:j.text||"",createdAt:j.createdAt||new Date().toISOString(),updatedAt:j.updatedAt||new Date().toISOString()}))
    .filter(j=>j.date);

  return d;
}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw)return normalizeData(JSON.parse(raw));
  }catch(e){}
  const d=emptyData();
  localStorage.setItem(KEY,JSON.stringify(d));
  return d;
}

let data=load();
let editingTaskId=null;
let completingTaskId=null;
let deletingProjectId=null;
let journalDate=todayISO();
let selectedDay=todayISO();
let calendarDate=new Date();
calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth(),1);
let taskFilter="all";
let projectFilter="all";
let reorderContext=null;
let draggingCard=null;

function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function save(){persist();renderAll()}
const projectById=id=>data.projects.find(p=>p.id===id);
const projectName=id=>projectById(id)?.name||"";
const journalByDate=date=>data.journals.find(j=>j.date===date);

function show(id){$("#"+id)?.classList.add("show")}
function hide(id){$("#"+id)?.classList.remove("show")}

function dueInfo(t){
  if(!t.dueDate||t.status==="done")return null;
  const today=parseDate(todayISO()).getTime();
  const due=parseDate(t.dueDate).getTime();
  const diff=Math.round((due-today)/86400000);
  if(diff<0)return{cls:"overdue",label:`期限超過 ${Math.abs(diff)}日`};
  if(diff===0)return{cls:"warning",label:"今日が期限"};
  if(diff===1)return{cls:"warning",label:"明日が期限"};
  if(diff===2)return{cls:"warning",label:"あと2日"};
  return{cls:"",label:`期限 ${jp(t.dueDate)}`};
}

function taskCard(t,context){
  const due=dueInfo(t);
  const pri={high:"高",mid:"中",low:"低"}[t.priority]||"";
  const carry=t.status!=="done"&&t.doDate&&t.doDate<todayISO()&&context==="today";
  return `<div class="task-card ${t.status==="done"?"completed":""} ${due?.cls==="overdue"?"overdue":""}" data-task="${esc(t.id)}">
    <div class="task-main">
      <button class="check ${t.status==="done"?"done":""}" data-complete="${esc(t.id)}" aria-label="${t.status==="done"?"完了を取り消す":"完了にする"}"></button>
      <div class="task-body" data-open="${esc(t.id)}">
        <div class="task-title">${esc(t.title)}</div>
        <div class="task-meta">
          ${t.projectId?`<span class="pill">${esc(projectName(t.projectId))}</span>`:""}
          <span class="pill ${esc(t.priority)}">優先 ${pri}</span>
          ${carry?`<span class="pill warning">持ち越し</span>`:""}
          ${t.doDate?`<span class="pill">${t.doDate===todayISO()?"今日":`実行 ${jp(t.doDate)}`}</span>`:""}
          ${due?`<span class="pill ${due.cls}">${esc(due.label)}</span>`:""}
          ${t.repeat?`<span class="pill">↻ ${{daily:"毎日",weekly:"毎週",monthly:"毎月"}[t.repeat]}</span>`:""}
        </div>
        ${t.memo?`<div class="task-note">${esc(t.memo)}</div>`:""}
        ${t.result?`<div class="result-box"><strong>成果メモ</strong><br>${esc(t.result)}</div>`:""}
      </div>
      <button class="grip" data-grip="${esc(t.id)}" aria-label="ドラッグして並び替え">⋮⋮</button>
    </div>
  </div>`;
}

function todayTasks(){
  const t=todayISO();
  const list=data.tasks.filter(x=>!x.archived && (
    (x.status==="open" && x.doDate && x.doDate<=t) ||
    (x.status==="done" && x.completedAt===t)
  ));
  const order=data.todayOrder[t]||[];
  return [...list].sort((a,b)=>{
    const ai=order.indexOf(a.id),bi=order.indexOf(b.id);
    if(ai===-1&&bi===-1)return data.tasks.indexOf(a)-data.tasks.indexOf(b);
    if(ai===-1)return 1;
    if(bi===-1)return -1;
    return ai-bi;
  });
}

function bindTaskInteractions(container,context){
  $$("[data-open]",container).forEach(el=>el.onclick=()=>openTask(el.dataset.open));
  $$("[data-complete]",container).forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    const t=data.tasks.find(x=>x.id===btn.dataset.complete);
    if(!t)return;
    if(t.status==="done")uncompleteTask(t);
    else{
      completingTaskId=t.id;
      $("#resultMemo").value="";
      show("resultModalWrap");
    }
  });
  bindReorder(container,context);
}

function bindReorder(container,context){
  $$("[data-grip]",container).forEach(grip=>{
    grip.onpointerdown=e=>{
      if(reorderContext!==context)return;
      const card=grip.closest("[data-task]");
      if(!card)return;
      e.preventDefault();
      draggingCard=card;
      card.classList.add("dragging");
      try{grip.setPointerCapture(e.pointerId)}catch(_){}
    };
    grip.onpointermove=e=>{
      if(!draggingCard||reorderContext!==context)return;
      e.preventDefault();
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const target=el?.closest?.("[data-task]");
      if(!target||target===draggingCard||target.parentElement!==container)return;
      const rect=target.getBoundingClientRect();
      const before=e.clientY<rect.top+rect.height/2;
      container.insertBefore(draggingCard,before?target:target.nextSibling);
    };
    const finish=e=>{
      if(!draggingCard)return;
      draggingCard.classList.remove("dragging");
      draggingCard=null;
      const ids=$$("[data-task]",container).map(x=>x.dataset.task);
      if(context==="tasks"){
        const rank=new Map(ids.map((id,i)=>[id,i]));
        const visible=new Set(ids);
        const visibleSorted=ids.map(id=>data.tasks.find(t=>t.id===id)).filter(Boolean);
        let vi=0;
        data.tasks=data.tasks.map(t=>visible.has(t.id)?visibleSorted[vi++]:t);
      }else{
        data.todayOrder[todayISO()]=ids;
      }
      persist();
    };
    grip.onpointerup=finish;
    grip.onpointercancel=finish;
  });
}

function nextRepeatDate(t){
  const base=t.doDate||t.completedAt||todayISO();
  if(t.repeat==="daily")return addDays(base,1);
  if(t.repeat==="weekly")return addDays(base,7);
  if(t.repeat==="monthly")return addMonths(base,1);
  return "";
}

function createNextRepeat(t){
  if(!t.repeat||t.generatedNextId)return;
  const nextDo=nextRepeatDate(t);
  if(!nextDo)return;
  let nextDue="";
  if(t.dueDate){
    if(t.doDate){
      const diff=Math.round((parseDate(t.dueDate)-parseDate(t.doDate))/86400000);
      nextDue=addDays(nextDo,diff);
    }else{
      nextDue=t.repeat==="daily"?addDays(t.dueDate,1):t.repeat==="weekly"?addDays(t.dueDate,7):addMonths(t.dueDate,1);
    }
  }
  const next={
    id:uid("t_"),title:t.title,projectId:t.projectId,memo:t.memo,doDate:nextDo,dueDate:nextDue,
    priority:t.priority,repeat:t.repeat,status:"open",completedAt:"",result:"",archived:false,
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),generatedFromId:t.id,generatedNextId:""
  };
  data.tasks.push(next);
  t.generatedNextId=next.id;
}

function completeTask(withMemo){
  const t=data.tasks.find(x=>x.id===completingTaskId);
  if(!t)return;
  t.status="done";
  t.completedAt=todayISO();
  t.result=withMemo?$("#resultMemo").value.trim():"";
  t.updatedAt=new Date().toISOString();
  createNextRepeat(t);
  completingTaskId=null;
  hide("resultModalWrap");
  save();
}

function uncompleteTask(t){
  if(t.generatedNextId){
    const next=data.tasks.find(x=>x.id===t.generatedNextId);
    if(next&&next.generatedFromId===t.id&&next.status==="open"&&!next.result){
      data.tasks=data.tasks.filter(x=>x.id!==next.id);
    }
    t.generatedNextId="";
  }
  t.status="open";
  t.completedAt="";
  t.result="";
  t.updatedAt=new Date().toISOString();
  save();
}

function monthDays(){
  const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
  const first=new Date(y,m,1);
  const start=new Date(y,m,1-first.getDay());
  const arr=[];
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);arr.push(d)}
  return arr;
}

$("#createProjectInline").onclick=()=>{
  const id=createProject($("#newProjectName").value);
  if(!id)return;
  $("#fProjectSelect").innerHTML=projectOptions(id);
  $("#fProjectSelect").value=id;
  $("#inlineProjectCreate").classList.remove("show");
  $("#newProjectName").value="";
  renderProjectFilter();
};

$("#clearDoDate").onclick=()=>{$("#fDoDate").value=""};

$("#deleteTaskBtn").onclick=()=>{
  const t=data.tasks.find(x=>x.id===editingTaskId);
  if(!t)return;
  if(confirm(`「${t.title}」を完全に削除しますか？\n完了履歴からも消えます。`)){
    if(t.generatedFromId){
      const parent=data.tasks.find(x=>x.id===t.generatedFromId);
      if(parent?.generatedNextId===t.id)parent.generatedNextId="";
    }
    data.tasks=data.tasks.filter(x=>x.id!==t.id);
    hide("taskModalWrap");
    save();
  }
};

$("#archiveTaskBtn").onclick=()=>{
  const t=data.tasks.find(x=>x.id===editingTaskId);
  if(!t)return;
  t.archived=!t.archived;
  t.updatedAt=new Date().toISOString();
  hide("taskModalWrap");
  save();
};

$("#completeWithoutMemo").onclick=()=>completeTask(false);
$("#saveResultMemo").onclick=()=>completeTask(true);

$("#manageProjectsBtn").onclick=()=>{
  renderProjectManager();
  show("projectModalWrap");
};

$("#projectManagerCreate").onclick=()=>{
  const id=createProject($("#projectManagerNewName").value);
  if(!id)return;
  $("#projectManagerNewName").value="";
  renderProjectManager();
  renderAll();
};

$("#confirmProjectDelete").onclick=()=>{
  const p=projectById(deletingProjectId);
  if(!p)return;
  const dest=$("#projectDeleteDestination").value;
  data.tasks.filter(t=>t.projectId===p.id).forEach(t=>t.projectId=dest);
  data.projects=data.projects.filter(x=>x.id!==p.id);
  deletingProjectId=null;
  hide("projectDeleteWrap");
  persist();
  renderProjectManager();
  renderAll();
};

$("#projectSelect").onchange=()=>{
  projectFilter=$("#projectSelect").value;
  renderTasks();
};

$("#searchTasks").oninput=renderTasks;

$$("[data-filter]").forEach(btn=>btn.onclick=()=>{
  $$("[data-filter]").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  taskFilter=btn.dataset.filter;
  renderTasks();
});

function toggleReorder(context){
  reorderContext=reorderContext===context?null:context;
  renderToday();
  renderTasks();
}
$("#reorderToday").onclick=()=>toggleReorder("today");
$("#reorderTasks").onclick=()=>toggleReorder("tasks");

$("#todayJournalEdit").onclick=()=>openJournal(todayISO());
$("#todayJournalDelete").onclick=()=>{
  if(confirm("今日の日報を削除しますか？")){
    data.journals=data.journals.filter(j=>j.date!==todayISO());
    save();
  }
};
$("#saveJournal").onclick=saveJournal;

$("#makeDailyPrompt").onclick=()=>{
  $("#dailyPrompt").textContent=dailyPromptText();
  show("dailyPromptWrap");
};
$("#copyDailyPrompt").onclick=()=>copyText($("#dailyPrompt").textContent,$("#copyDailyPrompt"));

$("#prevMonth").onclick=()=>{
  calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()-1,1);
  renderCalendar();
};
$("#nextMonth").onclick=()=>{
  calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+1,1);
  renderCalendar();
};

const today=todayISO();
const monthAgo=(()=>{const d=parseDate(today);d.setMonth(d.getMonth()-1);return iso(d)})();
$("#reviewFrom").value=monthAgo;
$("#reviewTo").value=today;
$("#generateReview").onclick=()=>{$("#reviewPrompt").textContent=reviewPromptText()};
$("#copyReview").onclick=()=>copyText($("#reviewPrompt").textContent,$("#copyReview"));

$$("[data-close]").forEach(btn=>btn.onclick=()=>hide(btn.dataset.close));
$$(".modal-wrap").forEach(w=>w.onclick=e=>{if(e.target===w)w.classList.remove("show")});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}

renderAll();
})();
</script>
</body>
</html>
